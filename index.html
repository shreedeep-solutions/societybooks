/* ── Phones & folded foldables ── */
.bl-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bl-grid{grid-template-columns:minmax(0,1fr)}.bl-runs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.bl-runs>.socc{flex:0 0 210px;margin-bottom:0!important}}
.split>*,.grid>*,.card,.tfmt>div{min-width:0}
input,select,textarea{max-width:100%}
@media (max-width:700px){
  .topbar{gap:6px;padding:0 8px}
  .brand>span:not(.logo){display:none}
  .topbar .soc{max-width:none;flex:1 1 auto;min-width:0;font-size:13px}
  .topbar .spacer{display:none}
  #tbUser,#tbPresence,#tbLock{display:none}
  #tbConn>span:last-child{display:none}
  #tbConn{padding:3px 6px}
  .pill.fy{padding:3px 7px;font-size:11px}
  .ph{padding:12px 12px 10px}.ph h1{font-size:17px}
  .ph .acts{margin-left:0;width:100%}
  .pc{padding:12px 10px 90px}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:250;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.06);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  #bnav button{flex:1;background:none;border:none;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;padding:6px 2px;border-radius:8px;box-shadow:none}
  #bnav button span{font-size:19px;line-height:1.1}#bnav button.on{color:var(--accent);background:var(--accent-soft)}
  .side{width:86vw!important;max-width:340px;left:-90vw!important;bottom:0!important;padding-bottom:90px}.side.show{left:0!important}
  .side-q,.side-foot{display:block}.side .it{padding:11px 16px;font-size:14px}
  #tbTheme,.topbar>button.ghost.sm[onclick="logout()"]{display:none}
  #menuBtn{display:none}
  .toast-wrap,#toasts{bottom:78px!important}
  .fr.c2{grid-template-columns:minmax(0,1fr)}
  .toolbar input,.toolbar select{min-width:0;flex:1 1 130px}
  .stat{padding:10px 11px}.stat .v{font-size:16px;letter-spacing:-.3px}.stat .l{font-size:11px}
  .ov{padding:8px 6px}.md-h{padding:12px 14px}.md-b{padding:12px;max-height:76vh}.md-f{flex-wrap:wrap;padding:10px 12px}
  .card{padding:12px}
  .tl{padding:5px 10px}
  table th,table td{padding:6px 8px}
  .tw td:first-child,.tw td.mono,.tw td.n,.tw td.b,.tw th{white-space:nowrap}
}
@media (max-width:380px){
  .topbar .soc{font-size:12px}
  .pill.fy{display:none}
  button.sm{padding:5px 8px}
}
#updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:9999;background:#1e293b;color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px;width:min(calc(100vw - 24px),440px);box-sizing:border-box}#updbar span{flex:1}#updbar button{white-space:nowrap}@media(min-width:900px){#updbar{bottom:20px}}#pov-go:disabled{opacity:.7}
a.lk{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}a.lk:hover{color:var(--accent);text-decoration:underline}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--accent-soft)}tr.flash td{animation:flashrow 2.4s}@keyframes flashrow{0%,60%{background:#ffe9a8}100%{background:transparent}}
#bk-body td,#bx-body td{padding:4px 3px}#bk-body input,#bk-body select,#bx-body input,#bx-body select{padding-left:6px;padding-right:4px}#bk-body td:nth-child(2) input{width:76px;min-width:76px}#bk-body td:nth-child(3){min-width:110px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bk-body td:nth-child(5) input{min-width:92px}#bk-body td:nth-child(6) input{min-width:124px}#bk-body td:nth-child(7) select{min-width:100px;max-width:130px}#bk-body td:nth-child(8) select{min-width:84px;max-width:96px}#bk-body td:nth-child(9) input{min-width:84px}#bk-body td:nth-child(10) input{min-width:190px;width:100%}#bx-body td:nth-child(2) input{min-width:124px}#bx-body td:nth-child(3) select{width:180px;min-width:180px;max-width:180px}#bx-body td:nth-child(4) select{min-width:100px;max-width:130px}#bx-body td:nth-child(5) input{min-width:92px}#bx-body td:nth-child(6) select{min-width:84px;max-width:96px}#bx-body td:nth-child(7) input{min-width:84px}#bx-body td:nth-child(8) input{min-width:260px;width:100%}
html.oldwin{--font:'DM Sans',Arial,sans-serif;--mono:'DM Mono',Consolas,monospace;--mr:'Noto Sans Devanagari',sans-serif}html.oldwin body,html.oldwin button,html.oldwin input,html.oldwin select,html.oldwin textarea{font-family:var(--font)}
.gs-it{padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}.gs-it:hover{background:var(--accent-soft);border-color:var(--border)}
.side .it .kbd{margin-left:auto;font-size:9.5px;padding:1px 5px;border:1px solid var(--border2);border-radius:4px;color:var(--tx3,var(--tx2));font-family:ui-monospace,Consolas,monospace;opacity:.75;white-space:nowrap}.side .it.on .kbd{opacity:1}@media (pointer:coarse),(max-width:900px){.side .it .kbd{display:none}}
</style>
</head>
<body>
<div id="auth"></div>
<div id="app">
  <div class="topbar">
    <button id="menuBtn" class="ghost sm" onclick="document.getElementById('side').classList.toggle('show')">☰</button>
    <div class="brand" style="font-size:15px;cursor:pointer" onclick="goFirm()"><span class="logo"><img data-applogo alt=""></span><span>Solutions4Society</span></div>
    <span class="soc" id="tbSoc" title="Back to all societies" onclick="goFirm()"></span>
    <span class="pill fy" id="tbFy" style="display:none" onclick="pickFY()"></span>
    <span id="tbLock"></span>
    <button class="ghost sm" id="tbSearch" onclick="gsOpen()" title="Search anything (Ctrl+K)">🔍</button>
    <span class="spacer"></span>
    <span id="tbPresence" class="row small muted"></span>
    <span class="pill" id="tbConn" title="Connection to database"><span class="dot"></span><span>Connecting…</span></span>
    <button class="ghost sm" id="tbTheme" onclick="toggleTheme()" title="Dark / light">🌙</button>
    <span class="pill" id="tbUser"></span>
    <button class="ghost sm" onclick="logout()">Logout</button>
  </div>
  <div class="body"><nav class="side" id="side"></nav><main id="main"></main></div>
  <nav id="bnav"></nav>
</div>
<div id="public"></div>
<div id="toasts"></div>
<div id="modals"></div>
<script src="app.20261112154835.js"></script>
</body>
</html>
