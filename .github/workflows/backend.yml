name: Deploy S4S backend
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/backend.yml']
  workflow_dispatch:
concurrency: { group: backend-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: cd functions && npm install --no-audit --no-fund
      - name: Deploy functions
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e '
            const fs=require("fs"); let j; const raw=fs.readFileSync(process.argv[1],"utf8");
            try { j=JSON.parse(raw); } catch(e) { console.log("::error::The secret is not valid JSON (length "+raw.length+", starts with "+JSON.stringify(raw.trim().slice(0,1))+", ends with "+JSON.stringify(raw.trim().slice(-1))+") — paste the WHOLE key file again"); process.exit(1); }
            console.log("key type:", j.type, "| account:", j.client_email, "| project:", j.project_id, "| private key present:", !!(j.private_key && j.private_key.includes("BEGIN PRIVATE KEY")));
            if (j.type!=="service_account") { console.log("::error::This is not a service-account key file"); process.exit(1); }
          ' "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only functions --project mysocietybooks --non-interactive --force
          npx --yes firebase-tools@latest functions:artifacts:setpolicy --location asia-southeast1 --days 1 --force --project mysocietybooks --non-interactive || echo "::warning::cleanup policy not set"
          rm -f "$RUNNER_TEMP/sa.json"
