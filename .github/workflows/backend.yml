name: Deploy S4S backend
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/backend.yml']
  workflow_dispatch:
concurrency: { group: backend-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: cd functions && npm install --no-audit --no-fund
      - name: Deploy functions
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only functions --project mysocietybooks --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
